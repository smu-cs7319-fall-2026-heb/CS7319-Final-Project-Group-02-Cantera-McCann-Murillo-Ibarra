services:
  dev:
    build: ./.devcontainer
    command: sleep infinity
    volumes:
      - type: bind
        # source is relative to the folder of the compose file listed first in
        # devcontainer.json dockerComposeFile.
        source: .
        target: /workspaces/c2

  clock:
    volumes:
      - type: bind
        # source is relative to the folder of the compose file listed first in
        # devcontainer.json dockerComposeFile.
        source: .
        target: /workspaces/c2
